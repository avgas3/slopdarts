name: Build and Push multi-arch Docker images

on:
  push:
    branches: [ "main" ]
    tags: ["v*", "*.*.*"]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/slopdarts:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/slopdarts:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/slopdarts:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/slopdarts:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/slopdarts:cache,mode=max
